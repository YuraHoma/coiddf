# Pages CMS configuration — https://pagescms.org
#
# Свідомо мінімальна конфігурація. Клієнту потрібно рівно шість речей:
# додавати й видаляти проєкти, новини, людей у команді та звіти, а також
# правити контактні й юридичні дані. Решта сайту (тексти сторінок, меню,
# банери, партнери) редагується розробником — тримати їх у CMS означало б
# завалити клієнта полями, у які він ніколи не зайде.
#
# Важливо: кожен файл нижче описаний ПОВНІСТЮ. Pages CMS зберігає лише ті
# поля, що є в схемі, тож частковий опис файлу тихо стер би решту даних.
# Саме тому контакти й реквізити винесені в окремі файли, а не лишилися
# в site.json поруч із меню.

media:
  input: src/assets
  output: /assets

content:
  # ---------------------------------------------------------------- Новини
  - name: news
    label: Новини
    type: collection
    path: src/news
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Заголовок, type: string, required: true }
      - { name: date, label: Дата, type: date, required: true }
      - { name: image, label: Головне фото, type: image }
      - { name: excerpt, label: Короткий опис (для списку та початку статті), type: text, required: true }
      - { name: body, label: Повний текст статті, type: rich-text }

  # ---------------------------------------------------------------- Проєкти
  - name: projects
    label: Проєкти
    type: collection
    path: src/projects
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - { name: title, label: Назва проєкту, type: string, required: true }
      - { name: date, label: Дата, type: date, required: true }
      - { name: image, label: Фото проєкту, type: image, required: true }
      - { name: excerpt, label: Короткий опис (для картки та початку сторінки), type: text, required: true }
      - name: direction
        label: Напрям
        type: select
        required: true
        options:
          values:
            - { value: gumanitarne, label: Гуманітарне реагування на кризові ситуації населення }
            - { value: cyfrova, label: Цифрова трансформація }
            - { value: energetyka, label: 'Енергетика, радіаційний захист та екологічна безпека' }
            - { value: viyskova, label: Підвищення військової готовності та національної безпеки }
      - { name: body, label: Повний текст проєкту (сторінка «Детальніше»), type: rich-text }

  # ---------------------------------------------------------------- Команда
  - name: team
    label: Команда
    type: file
    path: src/_data/team.json
    fields:
      - name: hero
        label: Банер сторінки
        type: object
        fields:
          - { name: eyebrow, label: Мітка, type: string }
          - { name: heading, label: Заголовок, type: text }
          - { name: lead, label: Підзаголовок, type: text }
      - name: members
        label: Учасники команди (перші двоє — засновники, вони у верхньому ряду)
        type: object
        list: true
        fields:
          - { name: role, label: Роль, type: string }
          - { name: name, label: "Ім'я (необов'язково)", type: string }
          - { name: photo, label: Фото, type: image }
          - { name: bio, label: "Опис (необов'язково)", type: text }

  # ---------------------------------------------------------------- Звіти
  - name: reports
    label: Річні звіти
    type: file
    path: src/_data/reports.json
    fields:
      - name: hero
        label: Банер сторінки
        type: object
        fields:
          - { name: eyebrow, label: Мітка, type: string }
          - { name: heading, label: Заголовок, type: text }
          - { name: lead, label: Підзаголовок, type: text }
      - { name: items, label: Документи звітності, type: string, list: true }
      - { name: note, label: 'Текст, поки список порожній', type: text }

  # ---------------------------------------------------------------- Контакти
  - name: contacts
    label: Контактні дані
    type: file
    path: src/_data/contacts.json
    fields:
      - { name: general, label: Email, type: string }
      - { name: formRecipient, label: 'Куди надсилати звернення з форми (порожньо — на Email вище)', type: string }
      - { name: phone, label: Телефон, type: string }
      - { name: address, label: Адреса, type: string }
      - name: socials
        label: Соцмережі (порожнє поле — іконка не показується)
        type: object
        fields:
          - { name: facebook, label: Facebook, type: string }
          - { name: twitter, label: Twitter / X, type: string }
          - { name: linkedin, label: LinkedIn, type: string }

  # ---------------------------------------------------------------- Юридичні дані
  - name: legal
    label: Юридичні дані
    type: file
    path: src/_data/legal.json
    fields:
      - name: hero
        label: Банер сторінки
        type: object
        fields:
          - { name: eyebrow, label: Мітка, type: string }
          - { name: heading, label: Заголовок, type: text }
          - { name: lead, label: Підзаголовок, type: text }
      - { name: edrpou, label: 'Код ЄДРПОУ (порожньо — у футері не показується)', type: string }
      - name: registration
        label: Реєстраційні коди (стрічка над меню)
        type: object
        list: true
        fields:
          - { name: label, label: Назва коду, type: string }
          - { name: value, label: Значення, type: string }
      - name: items
        label: Реєстраційні дані (рядок = підпис + значення)
        type: object
        list: true
        fields:
          - { name: label, label: Підпис, type: string }
          - { name: value, label: Значення, type: string }
      - { name: note, label: 'Текст, поки список порожній', type: text }
