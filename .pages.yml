# Pages CMS configuration — https://pagescms.org
#
# Свідомо мінімальна конфігурація. Клієнту потрібно рівно шість речей:
# додавати й видаляти проєкти, новини, людей у команді та звіти, а також
# правити контактні й юридичні дані. Решта сайту (тексти сторінок, меню,
# банери, партнери) редагується розробником — тримати їх у CMS означало б
# завалити клієнта полями, у які він ніколи не зайде.
#
# Важливо: кожен файл нижче описаний ПОВНІСТЮ. Pages CMS зберігає лише ті
# поля, що є в схемі, тож частковий опис файлу тихо стер би решту даних.
# Саме тому контакти й реквізити винесені в окремі файли, а не лишилися
# в site.json поруч із меню.
#
# Поля впорядковані так, як їх заповнюють: спершу те, без чого блок на
# сайті виглядатиме порожнім (позначене зірочкою як обовʼязкове), потім
# необовʼязкові доповнення. У новинах і проєктах підписів під полями
# немає навмисно — форма з пʼяти абзаців пояснень читається як анкета.
# Дві вимоги, недотримання яких видно на сайті одразу (орієнтація фото
# й початок тексту), винесені прямо в назву поля.
#
# Поля дати теж немає: імʼя файлу Pages CMS складає з дати створення
# запису, тобто з фактичної дати першої публікації, і саме з нього сайт
# бере дату та порядок. Щоб змінити дату матеріалу, треба перейменувати
# файл — тому давніший матеріал, доданий заднім числом, стане першим у
# списку.

media:
  input: src/assets
  output: /assets

content:
  # ---------------------------------------------------------------- Новини
  - name: news
    label: Новини
    type: collection
    path: src/news
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      primary: title
      fields: [title]
      sort: [title]
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      # Горизонтальне, від 1600 px по ширині: вертикальне лишає порожні
      # поля з боків картки. Воно ж іде в прев'ю при поширенні посилання.
      - name: image
        label: Головне фото
        type: image
        required: true
      # Перші два-три речення підуть у картку новини, в результати пошуку
      # і в прев'ю при поширенні — тож текст має починатися з головного.
      - name: body
        label: Текст новини
        type: rich-text
        required: true

  # ---------------------------------------------------------------- Проєкти
  - name: projects
    label: Проєкти
    type: collection
    path: src/projects
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      primary: title
      fields: [title]
      sort: [title]
    fields:
      - name: title
        label: Назва проєкту
        type: string
        required: true
      # Розділ сторінки «Проєкти», у який стане проєкт. Щойно в напрямі
      # зʼявляється перший проєкт, картка цього напряму на головній
      # починає вести просто в його розділ.
      - name: direction
        label: Напрям
        type: select
        required: true
        options:
          values:
            - { value: gumanitarne, label: Гуманітарне реагування на кризові ситуації населення }
            - { value: cyfrova, label: Цифрова трансформація }
            - { value: energetyka, label: 'Енергетика, радіаційний захист та екологічна безпека' }
            - { value: viyskova, label: Підвищення військової готовності та національної безпеки }
      # Горизонтальне, від 1600 px по ширині.
      - name: image
        label: Фото проєкту
        type: image
        required: true
      # Перші два-три речення підуть у картку проєкту, в результати
      # пошуку і в прев'ю при поширенні посилання.
      - name: body
        label: Текст проєкту
        type: rich-text
        required: true

  # ---------------------------------------------------------------- Команда
  # Банер сторінки (мітка, заголовок, підзаголовок) навмисно не тут: він
  # лежить у src/_data/komanda.json, який CMS не показує. Тексти сторінки
  # веде розробник, перелік людей — клієнт. Тримати їх в одному файлі не
  # можна: Pages CMS зберігає лише поля зі схеми й тихо стер би банер.
  - name: team
    label: Команда
    type: file
    path: src/_data/team.json
    fields:
      - name: members
        label: Учасники команди
        type: object
        list: true
        fields:
          - name: name
            label: "Ім'я та прізвище"
            type: string
            required: true
          - name: role
            label: Роль
            type: string
            required: true
          # Портрет, від 800 px по ширині, обличчя ближче до верху —
          # картка кадрує знизу.
          - name: photo
            label: Фото
            type: image
            required: true
          # Опис виводиться на сторінку лише у двох засновників у верхньому
          # ряду; у решти команди його не видно. Підпис прибрано на
          # прохання — тримаємо пояснення тут, у налаштуваннях.
          - name: bio
            label: Опис
            type: text

  # ---------------------------------------------------------------- Звіти
  # Банер сторінки лежить у src/_data/zvitnist.json, якого тут немає, —
  # з тієї ж причини, що й у команди: Pages CMS зберігає лише поля зі
  # схеми, тож банер у цьому ж файлі стерся б при першому збереженні.
  #
  # Поля дати теж немає: документ датується днем, коли він зʼявився на
  # сайті. Дату проставляє scripts/report-dates.js в окремий файл —
  # у самому reports.json вона б не пережила збереження з CMS.
  #
  # Текст, який показується замість порожнього переліку, теж лежить у
  # zvitnist.json: це текст сайту, а не дані фонду.
  - name: reports
    label: Річні звіти
    type: file
    path: src/_data/reports.json
    fields:
      - name: items
        label: Документи звітності
        type: object
        list: true
        fields:
          # Назва — так, як документ назве партнер: «Фінансова звітність
          # мікропідприємства за 2025 рік». З неї ж береться рік для
          # обкладинки-заглушки та адреса сторінки документа.
          - name: title
            label: Назва документа
            type: string
            required: true
          # PDF. Одного файлу достатньо на обидві мовні версії сайту.
          - name: file
            label: Файл
            type: file
            required: true
          # Необовʼязково: без неї сайт малює обкладинку сам — фірмовий
          # фон, рік і назва документа.
          - name: image
            label: Обкладинка
            type: image

  # ---------------------------------------------------------------- Контакти
  #
  # Пояснення до полів тримаємо тут, а не підписами у формі:
  #   Email — публічна пошта фонду: контакти, футер і структуровані дані
  #     для пошуковиків беруться саме звідси.
  #   Телефон — у форматі +38 0XX XXX XXXX.
  #   Адреса — одним рядком, що ЗАКІНЧУЄТЬСЯ містом, індексом і країною
  #     через кому, саме в такому порядку: з нього збирається адреса для
  #     пошуковиків. Приклад: вул. Межова, 23, м. Київ, 04123, Україна
  #   Куди надсилати звернення — порожнє поле означає «на Email вище».
  #     Заповнювати лише тоді, коли листи мають іти на іншу пошту.
  #   Соцмережі — повне посилання разом із https://. Порожнє поле просто
  #     не показує іконку, дірки у футері не буде.
  - name: contacts
    label: Контактні дані
    type: file
    path: src/_data/contacts.json
    fields:
      - name: general
        label: Email
        type: string
        required: true
      - name: phone
        label: Телефон
        type: string
        required: true
      - name: address
        label: Адреса
        type: string
        required: true
      - name: formRecipient
        label: 'Куди надсилати звернення з форми'
        type: string
      - name: socials
        label: Соцмережі
        type: object
        fields:
          - { name: facebook, label: Facebook, type: string }
          - { name: twitter, label: Twitter / X, type: string }
          - { name: linkedin, label: LinkedIn, type: string }

  # ---------------------------------------------------------------- Юридичні дані
  #
  # Пояснення до полів:
  #   Банер сторінки — мітка це коротке слово над заголовком, до 25 символів.
  #   Реєстраційні коди — показуються тонкою стрічкою над меню на КОЖНІЙ
  #     сторінці. Тримати тут два-три найважливіші: довший перелік стрічку
  #     переповнить.
  #   Реєстраційні дані — повний перелік для таблиці на самій сторінці.
  #   Код ЄДРПОУ — показується у блоці реєстрації, у футері та у
  #     структурованих даних для пошуковиків.
  #   Вступний текст — абзац під реєстраційними даними: чим займається
  #     організація.
  #   Політики — кожна стає карткою, яка розкривається: усередині опис,
  #     кнопка «Відкрити» і сам документ (PDF) для читання на сторінці.
  #     Опис необовʼязковий.
  #   Тексти «поки немає» — показуються ЗАМІСТЬ переліку, поки він порожній.
  - name: legal
    label: Юридичні дані
    type: file
    path: src/_data/legal.json
    fields:
      - name: hero
        label: Банер сторінки
        type: object
        fields:
          - { name: eyebrow, label: Мітка, type: string }
          - { name: heading, label: Заголовок, type: text, required: true }
          - { name: lead, label: Підзаголовок, type: text }
      # Заголовок над блоком реєстраційних даних на сторінці. Поле було
      # у файлі, але не в схемі — тобто перше ж збереження з CMS стерло б
      # його, і блок лишився б без заголовка.
      - name: regHeading
        label: Заголовок блоку реєстраційних даних
        type: string
      - name: registration
        label: Реєстраційні коди (стрічка над меню)
        type: object
        list: true
        fields:
          - { name: label, label: Назва коду, type: string, required: true }
          - { name: value, label: Значення, type: string, required: true }
      - name: items
        label: Реєстраційні дані (таблиця на сторінці)
        type: object
        list: true
        fields:
          - { name: label, label: Підпис, type: string, required: true }
          - { name: value, label: Значення, type: string, required: true }
      - name: edrpou
        label: Код ЄДРПОУ
        type: string
      - name: intro
        label: Вступний текст
        type: text
      - name: policiesHeading
        label: Заголовок розділу політик
        type: string
      - name: policiesLead
        label: Текст перед переліком політик
        type: text
      - name: policies
        label: Політики організації
        type: object
        list: true
        fields:
          - name: title
            label: Назва політики
            type: string
            required: true
          - name: description
            label: Опис
            type: text
          - name: file
            label: Документ
            type: file
            required: true
      - name: policiesNote
        label: 'Текст, поки політик немає'
        type: text
      - name: note
        label: 'Текст, поки список порожній'
        type: text
