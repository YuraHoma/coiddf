# Pages CMS configuration — https://pagescms.org
#
# Свідомо мінімальна конфігурація. Клієнту потрібно рівно шість речей:
# додавати й видаляти проєкти, новини, людей у команді та звіти, а також
# правити контактні й юридичні дані. Решта сайту (тексти сторінок, меню,
# банери, партнери) редагується розробником — тримати їх у CMS означало б
# завалити клієнта полями, у які він ніколи не зайде.
#
# Важливо: кожен файл нижче описаний ПОВНІСТЮ. Pages CMS зберігає лише ті
# поля, що є в схемі, тож частковий опис файлу тихо стер би решту даних.
# Саме тому контакти й реквізити винесені в окремі файли, а не лишилися
# в site.json поруч із меню.
#
# Поля впорядковані так, як їх заповнюють: спершу те, без чого блок на
# сайті виглядатиме порожнім (позначене зірочкою як обовʼязкове), потім
# необовʼязкові доповнення. Підказки під полями описують вимоги до
# матеріалу — саме недотримання цих вимог дає «діряві» блоки: картка без
# фото, вертикальне фото в горизонтальному місці, опис на пів сторінки.

media:
  input: src/assets
  output: /assets

content:
  # ---------------------------------------------------------------- Новини
  - name: news
    label: Новини
    type: collection
    path: src/news
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
        description: 'Пишіть як є. Якщо заголовок довгий, для вкладки браузера сайт скоротить його сам.'
      - name: date
        label: Дата
        type: date
        required: true
        description: 'Визначає порядок: найновіше зверху, і воно ж потрапляє на головну.'
      - name: image
        label: Головне фото
        type: image
        required: true
        description: 'Горизонтальне, від 1600 px по ширині. Без фото картка новини лишається сірим прямокутником, а при поширенні в соцмережах підтягнеться загальна картинка замість вашої.'
      - name: body
        label: Текст новини
        type: rich-text
        required: true
        description: 'Перші два-три речення підуть у картку новини, у результати пошуку і в попередній перегляд при поширенні посилання — тож починайте з головного.'

  # ---------------------------------------------------------------- Проєкти
  - name: projects
    label: Проєкти
    type: collection
    path: src/projects
    filename: '{year}-{month}-{day}-{fields.title}.md'
    view:
      primary: title
      fields: [title, date]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Назва проєкту
        type: string
        required: true
        description: 'Повна офіційна назва — саме вона стоїть заголовком на сторінці. Для вкладки браузера сайт скоротить її сам.'
      - name: date
        label: Дата
        type: date
        required: true
        description: 'Визначає порядок проєктів у розділі: найновіші зверху.'
      - name: direction
        label: Напрям
        type: select
        required: true
        description: 'Проєкт стане в цей розділ сторінки «Проєкти». Щойно в напрямі зʼявляється перший проєкт, картка цього напряму на головній починає вести просто в його розділ.'
        options:
          values:
            - { value: gumanitarne, label: Гуманітарне реагування на кризові ситуації населення }
            - { value: cyfrova, label: Цифрова трансформація }
            - { value: energetyka, label: 'Енергетика, радіаційний захист та екологічна безпека' }
            - { value: viyskova, label: Підвищення військової готовності та національної безпеки }
      - name: image
        label: Фото проєкту
        type: image
        required: true
        description: 'Горизонтальне, від 1600 px по ширині. Вертикальне фото лишає порожні поля з боків картки — до половини її площі.'
      - name: body
        label: Текст проєкту
        type: rich-text
        required: true
        description: 'Перші два-три речення підуть у картку проєкту, у результати пошуку і в попередній перегляд при поширенні посилання — тож починайте з головного.'

  # ---------------------------------------------------------------- Команда
  - name: team
    label: Команда
    type: file
    path: src/_data/team.json
    fields:
      - name: hero
        label: Банер сторінки
        type: object
        fields:
          - { name: eyebrow, label: Мітка, type: string, description: 'Коротке слово над заголовком, до 25 символів.' }
          - { name: heading, label: Заголовок, type: text, required: true }
          - { name: lead, label: Підзаголовок, type: text }
      - name: members
        label: Учасники команди
        type: object
        list: true
        description: 'Перші двоє — засновники, вони стоять окремим верхнім рядом із великими фото. Решта йде сіткою по четверо; щоб ряди були рівні, тримайте їхню кількість кратною чотирьом.'
        fields:
          - name: role
            label: Роль
            type: string
            required: true
            description: 'Показується завжди, навіть коли імені немає.'
          - name: photo
            label: Фото
            type: image
            required: true
            description: 'Портрет, від 800 px по ширині, обличчя ближче до верху — картка кадрує знизу. Без фото в сітці лишається порожня рамка.'
          - { name: name, label: "Ім'я", type: string, description: "Необовʼязково — якщо порожнє, показується лише роль." }
          - { name: bio, label: Опис, type: text, description: 'Необовʼязково. Показується лише у двох засновників у верхньому ряду; у решти команди опис на сторінку не виводиться.' }

  # ---------------------------------------------------------------- Звіти
  - name: reports
    label: Річні звіти
    type: file
    path: src/_data/reports.json
    fields:
      - name: hero
        label: Банер сторінки
        type: object
        fields:
          - { name: eyebrow, label: Мітка, type: string, description: 'Коротке слово над заголовком, до 25 символів.' }
          - { name: heading, label: Заголовок, type: text, required: true }
          - { name: lead, label: Підзаголовок, type: text }
      - name: items
        label: Документи звітності
        type: object
        list: true
        description: 'Кожен документ — окрема картка, яка відкриває файл у новій вкладці. Поки список порожній, на сторінці показується текст нижче замість пустого місця.'
        fields:
          - name: title
            label: Назва документа
            type: string
            required: true
            description: 'Так, як його має назвати партнер: «Фінансова звітність мікропідприємства за 2025 рік».'
          - name: tag
            label: Позначка
            type: string
            description: 'Коротке слово над назвою: «Річні звіти», «Фінансова звітність». Порожнє — позначки просто не буде.'
          - name: date
            label: Дата документа
            type: date
            description: 'Показується під назвою. Для річного звіту — кінець звітного періоду.'
          - name: image
            label: Обкладинка
            type: image
            description: 'Необовʼязково. Вертикальна, від 1200 px по ширині — підійде знімок першої сторінки документа. Якщо лишити порожнім, сайт намалює обкладинку сам: фірмовий фон, рік і назва цього ж звіту.'
          - name: file
            label: Файл
            type: file
            required: true
            description: 'PDF. Якщо документ містить і український, і англійський текст — достатньо одного файлу на обидві версії сайту.'
      - name: note
        label: 'Текст, поки список порожній'
        type: text
        description: 'Показується тільки тоді, коли жодного документа ще немає. Не лишайте порожнім, поки немає звітів.'

  # ---------------------------------------------------------------- Контакти
  - name: contacts
    label: Контактні дані
    type: file
    path: src/_data/contacts.json
    fields:
      - name: general
        label: Email
        type: string
        required: true
        description: 'Публічна пошта фонду: показується в контактах, у футері та у структурованих даних для пошуковиків.'
      - name: phone
        label: Телефон
        type: string
        required: true
        description: 'У форматі +38 0XX XXX XXXX.'
      - name: address
        label: Адреса
        type: string
        required: true
        description: 'Одним рядком, що закінчується містом, індексом і країною через кому — саме в такому порядку, бо з нього збирається адреса для пошуковиків. Приклад: вул. Межова, 23, м. Київ, 04215, Україна'
      - name: formRecipient
        label: 'Куди надсилати звернення з форми'
        type: string
        description: 'Необовʼязково. Порожнє поле — листи йдуть на Email вище. Заповнюйте, лише коли звернення мають приходити на іншу пошту.'
      - name: socials
        label: Соцмережі
        type: object
        description: 'Порожнє поле — іконка просто не показується, дірки в футері не буде.'
        fields:
          - { name: facebook, label: Facebook, type: string, description: 'Повне посилання, разом із https://' }
          - { name: twitter, label: Twitter / X, type: string, description: 'Повне посилання, разом із https://' }
          - { name: linkedin, label: LinkedIn, type: string, description: 'Повне посилання, разом із https://' }

  # ---------------------------------------------------------------- Юридичні дані
  - name: legal
    label: Юридичні дані
    type: file
    path: src/_data/legal.json
    fields:
      - name: hero
        label: Банер сторінки
        type: object
        fields:
          - { name: eyebrow, label: Мітка, type: string, description: 'Коротке слово над заголовком, до 25 символів.' }
          - { name: heading, label: Заголовок, type: text, required: true }
          - { name: lead, label: Підзаголовок, type: text }
      - name: registration
        label: Реєстраційні коди (стрічка над меню)
        type: object
        list: true
        description: 'Показуються тонкою стрічкою над меню на кожній сторінці. Тримайте тут два-три найважливіші коди — довший перелік стрічку переповнить.'
        fields:
          - { name: label, label: Назва коду, type: string, required: true }
          - { name: value, label: Значення, type: string, required: true }
      - name: items
        label: Реєстраційні дані (таблиця на сторінці)
        type: object
        list: true
        description: 'Повний перелік для сторінки юридичної інформації.'
        fields:
          - { name: label, label: Підпис, type: string, required: true }
          - { name: value, label: Значення, type: string, required: true }
      - name: edrpou
        label: Код ЄДРПОУ
        type: string
        description: 'Показується у блоці реєстраційної інформації, у футері та у структурованих даних для пошуковиків.'
      - name: intro
        label: Вступний текст
        type: text
        description: 'Абзац під реєстраційними даними: чим займається організація.'
      - name: policiesHeading
        label: Заголовок розділу політик
        type: string
      - name: policiesLead
        label: Текст перед переліком політик
        type: text
      - name: policies
        label: Політики організації
        type: object
        list: true
        description: 'Кожна політика — картка, яка розкривається: усередині опис, кнопка «Відкрити» і сам документ для читання прямо на сторінці.'
        fields:
          - name: title
            label: Назва політики
            type: string
            required: true
          - name: description
            label: Опис
            type: text
            description: 'Необовʼязково. Кілька речень про те, навіщо ця політика — показуються під заголовком, коли картку розкрито.'
          - name: file
            label: Документ
            type: file
            required: true
            description: 'PDF. Показується прямо на сторінці й відкривається окремо кнопкою.'
      - name: policiesNote
        label: 'Текст, поки політик немає'
        type: text
        description: 'Показується замість переліку, поки жодної політики не додано.'
      - name: note
        label: 'Текст, поки список порожній'
        type: text
        description: 'Показується тільки тоді, коли реєстраційних даних ще немає.'
