name: Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Клієнт додає новини й проєкти через CMS українською. Без цього кроку
      # збірка падала б на неперекладеному тексті, і його запис просто не
      # зʼявився б на сайті. Тому машинний переклад робиться тут, а каталог
      # повертається в репозиторій — щоб переклад не робився заново щобілду
      # і щоб новий текст потрапив у вивантаження для перекладача.
      - name: Translate new content
        run: npm run i18n:translate

      - name: Commit catalog if changed
        run: |
          if git diff --quiet -- scripts/i18n/catalog.json; then
            echo "Каталог не змінився."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/i18n/catalog.json
            git commit -m "Машинний переклад нового контенту з CMS [skip ci]"
            # Клієнт може зберегти дві правки в CMS поспіль: поки йшов
            # цей деплой, у main уже лежить наступний коміт, і прямий
            # push відлетів би з non-fast-forward.
            git pull --rebase origin main
            git push
          fi

      - run: npm run build

      # Перевірка зібраного сайту (биті посилання, метатеги, JSON-LD)
      # має спрацювати ДО викладення, інакше вона не має сенсу.
      - name: Check build
        run: npm run check

      - name: Deploy to Cloudflare Workers (icdf-preview)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"

      # Ключ Resend живе тільки в секретах — у репозиторії його немає.
      # Крок пропускається, якщо секрет ще не заведено, щоб відсутність
      # ключа не валила весь деплой сайту.
      - name: Upload Resend key to Worker secrets
        if: env.RESEND_API_KEY != ''
        run: echo "$RESEND_API_KEY" | npx --yes wrangler@4 secret put RESEND_API_KEY
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
